function aiReplyUncached(message){

 for(const [name,aliases] of Object.entries(subjectAliases))if(aliases.some(alias=>m.includes(alias))){subject=name;break}
 const directDefinitions={
  "arrays, linked lists, stacks, and queues":"Arrays store items in indexed positions, linked lists connect nodes with references, stacks follow Last In First Out, and queues follow First In First Out.",
  "trees, graphs, and hash tables":"Trees organize data hierarchically, graphs represent connected items, and hash tables store key-value pairs for fast lookup.",
  "choosing structures by access and update needs":"Choose a data structure based on the operations you need most: arrays are useful for indexed access, linked lists for frequent insertions, stacks for undo-style work, and queues for ordered processing.",
  "time and space complexity":"Time complexity describes how runtime grows as input grows, while space complexity describes the extra memory an algorithm needs. Big O notation expresses these growth rates."
 };
 const directKey=Object.keys(directDefinitions).find(key=>m.includes(key));
 if(directKey)return `**${directKey}**\n\n${directDefinitions[directKey]}\n\nExample: use a queue for print jobs because the first job added should normally be processed first.`;
 for(const s of Object.keys(SUBJECTS))for(const t of SUBJECTS[s].topics)if(m.includes(t.toLowerCase())){subject=s;topic=t}
 const subjectOnly=Boolean(subject&&!topic);
 const genericPrompt=/^(core definition|key relationships|typical examples|common mistakes)$/i.test(message.trim());
 if(genericPrompt)return `Please tell me the subject or topic you want to study. For example, ask: “Explain Data Structures” or “Explain Quadratic Equations simply.”`;
 if(!topic){topic=Object.keys(Q).find(t=>m.includes(t.toLowerCase()))||(subject?SUBJECTS[subject].topics[0]:w.topic);subject=subject||state.user.subjects[0]||"Mathematics"}
 const qs=Q[topic]||[];
 if(subjectOnly)return `**${subject}**\n\nI can help you study ${subject}. Available topics include:\n${SUBJECTS[subject].topics.map((x,i)=>`${i+1}. ${x}`).join("\n")}\n\nAsk me to explain any topic, give an example, or quiz you.`;
 if(m.includes("quiz")||m.includes("test")) return `Let's practice **${topic}**.\\n\\nTry this without looking anything up:\\n${qs[0]?.[0]||"Explain one key idea from this topic."}\\n\\nSend your answer and I'll explain the reasoning.`;
 if(m.includes("example")) return `Worked-example approach for **${topic}**:\\n\\n1. Identify the information given.\\n2. Choose the relevant rule or formula.\\n3. Substitute carefully.\\n4. Check whether the result makes sense.\\n\\nFor this topic, start with **${SUBJECTS[subject]?.topics?.includes(topic)?"the core definition":"the key concept"}** and then apply it to a simple case.`;
 if(m.includes("summar")) return `**Quick revision — ${topic}**\\n\\n${topicConcepts(topic).map(x=>"• "+x).join("\\n")}\\n\\nBest next step: close your notes and explain the main idea in your own words.`;
 if(m.includes("simply")||m.includes("beginner")) return `**${topic}, simply explained**\\n\\nThink of the topic as a set of connected ideas rather than a list to memorize. Start with the definition, connect it to one example, then practise recalling it without notes.\\n\\nKey ideas:\\n${topicConcepts(topic).slice(0,3).map((x,i)=>`${i+1}. ${x}`).join("\\n")}`;
 if(m.includes("wrong")||m.includes("mistake")) return `Let's debug the reasoning instead of only giving the answer. For **${topic}**, check:\\n\\n1. What was given?\\n2. Which definition/formula applies?\\n3. Did you substitute correctly?\\n4. Does your final answer match the units or expected form?\\n\\nPaste your working and I can point out the step that needs attention.`;
 return `Good question. I can help you learn **${topic}** step by step.\\n\\nCore ideas:\\n${topicConcepts(topic).slice(0,4).map((x,i)=>`${i+1}. ${x}`).join("\\n")}\\n\\nTry explaining the first idea back to me in your own words — that turns this from passive reading into active learning.`;
}

function parseJwtPayload(token){
 try{
  const base64Url = token.split(".")[1];
  const base64 = base64Url.replace(/-/g,"+").replace(/_/g,"/");
  const padded = base64 + "=".repeat((4 - base64.length % 4) % 4);
  const json = decodeURIComponent(atob(padded).split("").map((c)=>`%${("00" + c.charCodeAt(0).toString(16)).slice(-2)}`).join(""));
  return JSON.parse(json);
 }catch{return null}
}
